<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>JARVIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<style>
  /* ===== Ajustes SOLO para la APP Android (no tocan el widget de la PC) ===== */
  html, body { height: 100%; background: #010a12; -webkit-text-size-adjust: 100%; }
  /* La app ocupa toda la pantalla (bajo la barra de estado del telefono). El
     WebView ya recibe el margen de las barras del sistema; aqui solo damos aire
     interno para que nada choque con la hora ni las notificaciones. */
  #app { position: fixed !important; inset: 0 !important; justify-content: flex-start !important; }
  /* Orden (orden del jefe 04/10/2026): la barra va ARRIBA y el chat se
     despliega DEBAJO, ocupando el resto de la pantalla. */
  .barra {
    order: -1 !important;
    height: auto !important;
    min-height: 58px !important;
      padding-top: calc(18px + env(safe-area-inset-top)) !important;
    padding-bottom: 12px !important;
    border-bottom: 1px solid rgba(var(--jc), 0.22);
  }
  .chat {
    order: 0 !important;
    flex: 1 1 auto !important;
    height: auto !important;
    min-height: 0 !important;
  }
  /* Tipografia legible en telefono (el widget de PC usa 10.5px). */
  .msg { font-size: 13px !important; line-height: 1.45 !important; max-width: 88% !important; }
  .msg code { font-size: 12px !important; }
  /* Enlaces presionables en el chat (orden del jefe 04/10/2026). */
  .msg a.link-jefe {
    color: #22e6ff !important;
    text-decoration: underline !important;
    word-break: break-all !important;
    cursor: pointer !important;
  }
  .chat-input { font-size: 15px !important; padding: 9px 11px !important; }
  .chat-titulo { font-size: 10px !important; }
  .burbuja-texto { font-size: 13px !important; }
  .frase { display: none !important; }
  .estado { font-size: 11.5px !important; }
  /* La barra vive ARRIBA: su fila de estado y onda se centra sola (orden 04/10/2026). */
  .info { justify-content: center !important; }
  .fila { align-items: center !important; }
  .btn { width: 34px !important; height: 34px !important; }
  .btn svg { width: 16px !important; height: 16px !important; }
  .esfera-zona { width: 46px !important; height: 46px !important; }
  /* El estado "listening" se muestra como "JARVIS, EN LÍNEA" (orden del jefe 04/10/2026). */
  body.st-listening .estado { color: rgb(var(--jc)) !important; }
  /* Pantalla nativa (orden del jefe 04/10/2026): SIN marco. El widget de PC trae
     un borde interior cian que en el telefono se ve como un recuadro; aqui se
     anula del todo, en todos los estados. */
  #app, body.activo #app, body.st-speaking #app, body.st-muted #app {
    box-shadow: none !important;
    border: 0 !important;
  }
  /* Sin el rótulo duplicado "JARVIS · CHAT": la barra de arriba ya identifica. */
  .chat-cab { display: none !important; }
  /* ===== OVERLAY DE LLAMADA (orden del jefe 04/10/2026) ===== */
  /* Al tocar la esfera: la esfera crece a pantalla completa con sus animaciones,
     como un widget superpuesto tipo llamada, con botones de mutear y colgar. */
  #call {
    position: fixed !important;
    inset: 0 !important;
    z-index: 9999 !important;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background:
      radial-gradient(120% 90% at 50% 30%, rgba(var(--jc), 0.14) 0%, transparent 60%),
      linear-gradient(165deg, #061a2c 0%, #04121f 50%, #010a12 100%) !important;
  }
  body.en-llamada #call { display: flex !important; animation: entrar 0.3s ease both; }
  .call-esfera {
    position: relative;
    width: 62vw; height: 62vw;
    max-width: 340px; max-height: 340px;
  }
  .call-esfera #esferaG {
    position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  }
  .call-esfera .halo {
    position: absolute; inset: -6%; border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--jc), 0.22) 0%, transparent 68%);
    opacity: 0.8;
  }
  .call-esfera .orbita {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid rgba(var(--jc), 0.5);
    animation: pulso 2.2s ease-out infinite;
  }
  .call-nombre {
    font-size: 13px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: rgb(var(--jc));
  }
  .call-estado {
    font-size: 11px; letter-spacing: 1px; color: rgba(214, 236, 250, .8);
    min-height: 14px;
  }
  .call-botones { display: flex; gap: 26px; align-items: center; }
  .call-btn {
    width: 62px; height: 62px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(var(--jc), 0.4);
    background: rgba(var(--jc), 0.1);
    color: rgba(220, 240, 255, 0.95);
    cursor: pointer; transition: all .16s ease;
  }
  .call-btn svg { width: 26px; height: 26px; }
  .call-btn.mute { color: #fff; }
  .call-btn.mute.mudo {
    background: rgba(248, 113, 113, .18);
    border-color: rgba(248, 113, 113, .6);
    color: rgb(252, 165, 165);
  }
  .call-btn.colgar {
    background: rgba(239, 68, 68, .9);
    border-color: rgba(239, 68, 68, 1);
    color: #fff;
  }
  /* Microfono en dictado: se marca en cian para saber que esta escuchando. */
  #btnMic.dictando {
    background: rgba(var(--jc), .28) !important;
    border-color: rgba(var(--jc), .7) !important;
    color: #fff !important;
  }
</style>
<script src="temas_esfera.js"></script>
<script>
/* =========================================================================
   Puente Android: emula window.pywebview.api (lo que el widget espera de
   pywebview en la PC). Cada llamada se resuelve como Promise para que el
   propio JavaScript del widget (.then) siga funcionando sin cambios.
   ========================================================================= */
(function () {
  function jparse(s, def) { try { return JSON.parse(s); } catch (e) { return def; } }
  var api = {
    enviar_mensaje: function (t) {
      try { Android.enviar_mensaje(String(t == null ? '' : t)); } catch (e) {}
      return Promise.resolve();
    },
    interrumpir: function () { try { Android.interrumpir(); } catch (e) {} return Promise.resolve(); },
    reiniciar_jarvis: function () { try { Android.reiniciar_jarvis(); } catch (e) {} return Promise.resolve(); },
    notif_estado: function () { try { return Promise.resolve(String(Android.notif_estado())); } catch (e) { return Promise.resolve('0'); } },
    set_notif: function (v) { try { Android.set_notif(String(v)); } catch (e) {} return Promise.resolve(); },
    abrir_enlace: function (url) { try { Android.abrir_enlace(String(url || '')); } catch (e) {} return Promise.resolve(); },
    abrir_ajustes: function () { try { Android.abrir_ajustes(); } catch (e) {} return Promise.resolve(); },
    adjuntar: function () { try { Android.adjuntar(); } catch (e) {} return Promise.resolve(); },
    toggle_mic: function () {
      try { return Promise.resolve(jparse(Android.toggle_mic(), { ok: true })); }
      catch (e) { return Promise.resolve({ ok: true }); }
    },
    get_sphere_theme: function () {
      try { return Promise.resolve(jparse(Android.get_sphere_theme(), { ok: false })); }
      catch (e) { return Promise.resolve({ ok: false }); }
    },
    estado: function () {
      try { return Promise.resolve(jparse(Android.estado(), { ok: false })); }
      catch (e) { return Promise.resolve({ ok: false }); }
    },
    expandir: function (v) { try { Android.expandir(!!v); } catch (e) {} return Promise.resolve(); },
    abrir_ventana: function () { try { Android.abrir_ventana(); } catch (e) {} return Promise.resolve(); },
    llamada_iniciar: function () { try { Android.llamada_iniciar(); } catch (e) {} return Promise.resolve(); },
    llamada_cerrar: function () { try { Android.llamada_cerrar(); } catch (e) {} return Promise.resolve(); },
    llamada_mute: function (m) { try { Android.llamada_mute(!!m); } catch (e) {} return Promise.resolve(); },
    historial_leer: function () { try { return Promise.resolve({ leer: Android.historial_leer() }); } catch (e) { return Promise.resolve({ leer: "[]" }); } },
    historial_guardar: function (j) { try { Android.historial_guardar(String(j || '[]')); } catch (e) {} return Promise.resolve(); },
    dar_foco: function () { try { Android.dar_foco(); } catch (e) {} return Promise.resolve(); },
    ocultar_desactivar: function () { try { Android.ocultar_desactivar(); } catch (e) {} return Promise.resolve(); },
    dictar: function () { try { Android.dictar(); } catch (e) {} return Promise.resolve(); },
    dictado: function (activo) { try { Android.dictado(!!activo); } catch (e) {} return Promise.resolve(); },
    drag_start: function () {}, drag_nativo: function () {}, drag_end: function () {},
    menu_contextual: function () {},
    // --- ACCESO A TELEGRAM (orden del jefe 04/10/2026): todos los datos de una vez.
    credenciales_leer: function () {
      try { return Promise.resolve(jparse(Android.credenciales_leer(), { ok: false })); }
      catch (e) { return Promise.resolve({ ok: false }); }
    },
    iniciar_acceso: function (tel, id, hash, bot) {
      try { Android.iniciar_acceso(String(tel || ''), String(id || ''), String(hash || ''), String(bot || '')); }
      catch (e) {}
      return Promise.resolve();
    },
    enviar_paso: function (fase, valor) {
      try { Android.enviar_paso(String(fase || ''), String(valor || '')); }
      catch (e) {}
      return Promise.resolve();
    },
    acceso_paso: function (r) { try { Android.acceso_paso(String(r || '')); } catch (e) {} return Promise.resolve(); },
    listo: function (v) { try { Android.listo(!!v); } catch (e) {} return Promise.resolve(); },
    cerrar_acceso: function () { try { Android.cerrar_acceso(); } catch (e) {} return Promise.resolve(); }
  };
  window.pywebview = { api: api };
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      try { window.dispatchEvent(new Event('pywebviewready')); } catch (e) {}
    }, 40);
  });
})();
</script>
<style>
  /* IMPORTANTE — El diseño va A SANGRE (ocupa toda la ventana).
     WebView2 pinta un fondo opaco #202020 que ignora la transparencia, así que
     cualquier margen o border-radius dejaría ver un rectángulo gris. El
     redondeado de esquinas lo aplica el compositor de Windows (DWM). */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  :root { --jc: 0, 255, 255; }   /* color actual de JARVIS */

  /* Pantalla de carga ELIMINADA (orden del jefe 04/10/2026): arranque directo. */

  /* La barra va ABAJO y el panel crece hacia ARRIBA: la ventana se ancla por su
     borde inferior, así el widget no "baja" al expandirse. */
  #app {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    background:
      radial-gradient(120% 160% at 10% 100%, rgba(var(--jc), 0.13) 0%, transparent 58%),
      linear-gradient(160deg, #061a2c 0%, #04121f 48%, #010a12 100%);
    box-shadow: inset 0 0 0 1px rgba(var(--jc), 0.2);
    transition: box-shadow 0.4s ease;
  }
  body.activo #app { box-shadow: inset 0 0 0 1px rgba(var(--jc), 0.46); }
  body.st-speaking #app { box-shadow: inset 0 0 0 1px rgba(var(--jc), 0.66); }

  /* Rejilla técnica tenue */
  #app::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(var(--jc), 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(var(--jc), 0.05) 1px, transparent 1px);
    background-size: 15px 15px;
    mask-image: linear-gradient(20deg, #000 0%, transparent 65%);
    -webkit-mask-image: linear-gradient(20deg, #000 0%, transparent 65%);
  }

  /* ---- Panel de respuesta (arriba, imagen + texto en fila) ---- */
  .panel {
    position: relative;
    flex: 1;
    min-height: 0;
    display: none;
    gap: 9px;
    padding: 9px 11px 5px;
    overflow: hidden;
  }
  body.expandido .panel { display: flex; animation: entrar 0.28s ease both; }
  @keyframes entrar { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

  /* Imagen con tamaño FIJO: así el layout nunca salta al cargar */
  .foto {
    position: relative;
    width: 62px;
    height: 62px;
    flex: 0 0 auto;
    border-radius: 10px;
    overflow: hidden;
    display: none;
    background: rgba(var(--jc), 0.07);
    box-shadow: 0 0 0 1px rgba(var(--jc), 0.28), 0 3px 12px rgba(0, 0, 0, 0.5);
  }
  .foto.visible { display: block; }
  .foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .foto img.cargada { opacity: 1; }
  /* Brillo sutil mientras carga */
  .foto::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 25%, rgba(var(--jc), 0.16) 50%, transparent 75%);
    background-size: 220% 100%;
    animation: brillo 1.2s ease-in-out infinite;
  }
  .foto.lista::after { display: none; }
  @keyframes brillo { from { background-position: 180% 0; } to { background-position: -60% 0; } }

  .cuerpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .titulo {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgb(var(--jc));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }
  .titulo.visible { display: block; }

  /* Texto pequeño: solo para seguir lo que dice, no para leer en detalle */
  .texto {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    font-size: 10px;
    line-height: 1.45;
    color: rgba(222, 240, 252, 0.9);
    overflow-wrap: anywhere;
    padding-right: 3px;
    scrollbar-width: thin;
    scrollbar-color: rgba(var(--jc), 0.3) transparent;
  }
  .texto::-webkit-scrollbar { width: 4px; }
  .texto::-webkit-scrollbar-thumb { background: rgba(var(--jc), 0.3); border-radius: 2px; }
  .texto code {
    font-family: Consolas, monospace;
    font-size: 9.5px;
    background: rgba(var(--jc), 0.12);
    padding: 1px 4px;
    border-radius: 3px;
  }
  .cursor {
    display: none;
    width: 5px;
    height: 10px;
    background: rgb(var(--jc));
    vertical-align: -1px;
    margin-left: 2px;
    animation: parpadeo 0.9s steps(2) infinite;
  }
  body.st-speaking .cursor { display: inline-block; }
  @keyframes parpadeo { 50% { opacity: 0; } }

  /* Separador entre panel y barra */
  .sep {
    display: none;
    height: 1px;
    margin: 0 12px;
    flex-shrink: 0;
    background: linear-gradient(90deg, transparent, rgba(var(--jc), 0.3), transparent);
  }
  body.expandido .sep { display: block; }

  /* ---- Burbuja superior (respuestas con el chat minimizado) ----
     Aparece ENCIMA del icono flotante, sin abrir el mini-chat. La ventana
     crece hacia arriba (mecanismo expandir); la barra se queda abajo y la
     burbuja ocupa el espacio extra, con flecha hacia la esfera. */
  .burbuja {
    position: relative;
    flex: 1;
    min-height: 0;
    display: none;
    flex-direction: column;
    margin: 7px 9px 0;
    padding: 8px 10px 9px;
    border-radius: 11px;
    background: linear-gradient(168deg, rgba(7, 28, 46, 0.97), rgba(4, 18, 31, 0.97));
    border: 1px solid rgba(var(--jc), 0.38);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.55), inset 0 0 26px rgba(var(--jc), 0.08);
    overflow: hidden;
  }
  body.expandido .burbuja { display: flex; animation: entrar 0.24s ease both; }
  /* TEXTO ENCIMA DEL WIDGET DESACTIVADO (03/10/2026, orden del jefe): la
     burbuja superior y el panel de respuesta ya no se muestran; solo quedan la
     esfera y sus efectos normales. */
  .burbuja, .panel { display: none !important; }
  /* Flecha que apunta hacia la barra (la esfera) */
  .burbuja::after {
    content: '';
    position: absolute;
    left: 44px;
    bottom: -7px;
    width: 12px;
    height: 12px;
    background: rgba(4, 18, 31, 0.97);
    border-right: 1px solid rgba(var(--jc), 0.38);
    border-bottom: 1px solid rgba(var(--jc), 0.38);
    transform: rotate(45deg);
    border-bottom-right-radius: 3px;
  }
  .burbuja-autor {
    flex-shrink: 0;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: rgb(var(--jc));
    margin-bottom: 3px;
  }
  .burbuja-texto {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    font-size: 10.5px;
    line-height: 1.45;
    color: rgba(235, 245, 255, 0.94);
    white-space: pre-wrap;   /* formato (fix 05/10/2026) */
    overflow-wrap: anywhere;
    padding-right: 3px;
    scrollbar-width: thin;
    scrollbar-color: rgba(var(--jc), 0.3) transparent;
  }
  .burbuja-texto::-webkit-scrollbar { width: 4px; }
  .burbuja-texto::-webkit-scrollbar-thumb { background: rgba(var(--jc), 0.3); border-radius: 2px; }
  .burbuja-texto.jefe { color: rgba(196, 232, 255, 0.96); }

  /* ---- Barra compacta (abajo) ----
     Reparto: esfera · estado · onda (rellena el hueco) · botón.
     La onda existe justamente para que no quede un vacío muerto entre el
     rótulo y el botón de expandir. */
  .barra {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 56px;
    padding: 0 10px 0 9px;
    flex-shrink: 0;
  }

  .esfera-zona {
    position: relative;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    cursor: grab;
  }
  .esfera-zona:active { cursor: grabbing; }
  #esfera { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .halo {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--jc), 0.26) 0%, transparent 66%);
    opacity: 0.45;
    transition: opacity 0.4s ease;
  }
  body.activo .halo { opacity: 1; }
  .orbita {
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 1px solid rgba(var(--jc), 0.45);
    opacity: 0;
    pointer-events: none;
  }
  body.st-listening .orbita { animation: pulso 2s ease-out infinite; }
  /* En espera de la palabra clave: latido lento, casi imperceptible. Señala que
     JARVIS sigue ahí sin dar la impresión de estar transmitiendo. */
  body.st-armed .orbita { animation: pulso 3.6s ease-out infinite; opacity: .55; }
  /* En reposo: aún más lento, pero sigue latiendo. Que se note la diferencia con
     inactivo (micrófono apagado), donde no hay latido ninguno. */
  body.st-asleep .orbita { animation: pulso 5.5s ease-out infinite; opacity: .38; }
  body.st-speaking  .orbita { animation: pulso 1.05s ease-out infinite; }
  body.st-thinking  .orbita {
    opacity: 1;
    border-color: rgba(var(--jc), 0.8);
    border-right-color: transparent;
    border-bottom-color: transparent;
    animation: girar 0.5s linear infinite;
  }
  @keyframes pulso { 0% { opacity: .8; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.4); } }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* La info NO se estira: se ajusta a su contenido y el sobrante se lo queda la
     onda. Así el rótulo queda junto a la esfera y no flotando en medio. */
  .info { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fila { display: flex; align-items: center; gap: 5px; }
  .punto {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgb(var(--jc));
    box-shadow: 0 0 6px rgb(var(--jc));
    flex-shrink: 0;
  }
  body.activo .punto { animation: latir 1.7s ease-in-out infinite; }
  @keyframes latir { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.6)} }
  /* PROCESANDO/CARGANDO (orden del jefe 04/10/2026): la lucesita parpadea mas
     intermitente (encendido/apagado seco) para denotar actividad. */
  body.st-thinking .punto { animation: parpadeoLuz .34s steps(2, jump-none) infinite; }
  @keyframes parpadeoLuz { 0%,49%{opacity:1;transform:scale(1.15)} 50%,100%{opacity:.15;transform:scale(.7)} }
  .estado {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgb(var(--jc));
    white-space: nowrap;
  }
  body.st-muted .estado { color: rgba(148, 163, 184, .9); }
  body.st-muted .punto { background: rgba(148,163,184,.9); box-shadow: none; }

  /* Escribiendo: rojo y con más presencia. JARVIS tiene el teclado tomado,
     conviene que se vea de un vistazo para no escribir encima. */
  body.st-writing .estado {
    color: rgb(255, 70, 70);
    text-shadow: 0 0 8px rgba(255, 45, 45, .75);
    animation: latirTexto 1s ease-in-out infinite;
  }
  body.st-writing .punto {
    animation: latir .55s ease-in-out infinite;
    box-shadow: 0 0 10px rgb(255, 45, 45), 0 0 18px rgba(255, 45, 45, .55);
  }
  @keyframes latirTexto { 0%,100%{opacity:1} 50%{opacity:.5} }

  /* Frase corta de la barra (solo cuando el panel está cerrado) */
  .frase {
    font-size: 9.5px;
    line-height: 1.25;
    color: rgba(214, 236, 250, .82);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
  }
  .frase:empty, body.expandido .frase { display: none; }

  /* Medidor de barras: se come el espacio libre entre el rótulo y el botón, que
     era lo que se veía vacío. En reposo casi plano; hablando, salta. */
  .onda-zona {
    flex: 1 1 auto;
    min-width: 26px;

<script src="temas_esfera.js"></script>
<script>
  // Version del APK que trae este widget (para saber que build corre de verdad).
  const _APP_VERSION = '26.0';
  try { window.JARVIS_APP_VERSION = _APP_VERSION; } catch (e) {}
  const _ETIQUETAS = {
    MUTED: 'Inactivo', LISTENING: 'JARVIS, EN LÍNEA',
    ARMED: 'Di "JARVIS"', ASLEEP: 'En reposo',
    THINKING: 'Procesando...', SPEAKING: 'Respondiendo',
    WRITING: 'Escribiendo',
  };
  // Estado de pensar: SIEMPRE "Procesando...", nunca "Trabajando..."
  // (orden del jefe 05/10/2026). Se deja como lista por si algun dia se quiere
  // volver a alternar.
  const _TEXTOS_PENSANDO = ['Procesando...'];
  let _idxPensando = 0;

  // Los colores vienen del tema elegido en Configuración (temas_esfera.js),
  // así la esfera del widget y la de la interfaz de voz siempre coinciden.
  let _tema = (window.TemasEsfera && window.TemasEsfera.DEFECTO) || 'cyan';
  let _COLORES = window.TemasEsfera
    ? window.TemasEsfera.coloresWidget(_tema)
    : {
        MUTED: [30, 70, 75], LISTENING: [0, 255, 255],
        ARMED: [0, 132, 168], ASLEEP: [46, 92, 116],
        THINKING: [255, 196, 0], SPEAKING: [34, 230, 255],
        WRITING: [255, 45, 45],
      };

  let _estado = 'MUTED';
  let _color = _COLORES.MUTED.slice();
  let _objetivo = _COLORES.MUTED.slice();
  // FLUIDEZ (05/10/2026): color actual en texto ('r,g,b'), compartido con el
  // bucle de la barra. Antes ese bucle llamaba a getComputedStyle en CADA cuadro
  // (recalculo de estilos) y el color se reescribia en el DOM en cada cuadro.
  let _rgbCSS = '0,255,255';
  // Timer del cierre automático de la burbuja superior (respuestas con el
  // chat minimizado): se programa al volver al reposo y se cancela con
  // cualquier actividad nueva.
  let _timerCierre = null;

  /** Cambia el tema de color en caliente. Lo llama Python al guardar. */
  window.wSetTema = function (clave) {
    if (!window.TemasEsfera) return;
    _tema = clave || window.TemasEsfera.DEFECTO;
    _COLORES = window.TemasEsfera.coloresWidget(_tema);
    window.TemasEsfera.aplicarVariables(_tema);
    // Reapuntar el color objetivo al del estado actual: la transición del
    // bucle de dibujo hace el resto y el cambio se ve suave.
    _objetivo = (_COLORES[_estado] || _COLORES.MUTED).slice();
  };

  function _api() {
    return (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
  }
  function _el(id) { return document.getElementById(id); }

  /* ---- Esfera de partículas ----
     Se dibuja al DOBLE de resolución (el canvas mide 80px de lado y el CSS lo
     encoge a 40): a este tamaño tan pequeño, sin ese sobremuestreo las
     partículas salían con bordes dentados y el conjunto parecía suciedad en
     pantalla. Además, las partículas se reparten con la espiral de Fibonacci en
     vez de al azar, para que la esfera se lea como una esfera y no como un
     puñado de puntos con zonas vacías. */
  const _pulso = { valor: 0 };      // 0..1, lo agita el estado (habla / escribe)

  (function () {
    const cv = _el('esfera'), ctx = cv.getContext('2d');
    const LADO = 40, ESC = 2;       // tamaño CSS y factor de sobremuestreo
    const C = LADO / 2, RAD = 14.2, F = 115;
    const N = 78;
    const ps = [];
    const AUREO = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < N; i++) {
      const y = 1 - (i / (N - 1)) * 2;          // de +1 a -1
      const rr = Math.sqrt(Math.max(0, 1 - y * y));
      const th = AUREO * i;
      ps.push({
        x: RAD * Math.cos(th) * rr,
        y: RAD * y,
        z: RAD * Math.sin(th) * rr,
        r: 0.5 + Math.random() * 0.55,
        f: Math.random() * Math.PI * 2,          // fase propia del centelleo
      });
    }
    ctx.scale(ESC, ESC);

    // Esfera GRANDE de la llamada: mismo dibujo, mas resolucion. Se pinta en
    // cada frame junto con la pequena, reutilizando color y pulso.
    const cvG = _el('esferaG');
    const ctxG = cvG ? cvG.getContext('2d') : null;
    const ESCG = 6;                 // el canvas mide 480 y el CSS lo escala
    if (ctxG) ctxG.scale(ESCG, ESCG);
    const LG = 80, CG = LG / 2, RADG = 28.4;

    let ang = 0, t = 0;

    function pintar(cc, lado, centro, radio, foco, escala) {
      const ln = cc.lineWidth;
      for (const p of ps) {
        // Giro en Y y luego inclinación en X: se ven los polos, no un anillo.
        const x1 = Math.cos(ang) * p.x + Math.sin(ang) * p.z;
        const z1 = -Math.sin(ang) * p.x + Math.cos(ang) * p.z;
        const y2 = Math.cos(inc) * p.y - Math.sin(inc) * z1;
        const z2 = Math.sin(inc) * p.y + Math.cos(inc) * z1;

        const m = (foco / (foco - z2)) * escala;
        const px = centro + x1 * m, py = centro + y2 * m;
        const prof = (z2 + radio) / (radio * 2);
        const centelleo = 0.85 + 0.15 * Math.sin(t * 1.5 + p.f);
        const a = Math.max(0.08, Math.min(1, prof * prof * 0.95 + 0.1)) * centelleo;

        cc.fillStyle = 'rgba(' + _rgb + ',' + a.toFixed(3) + ')';
        cc.beginPath();
        cc.arc(px, py, p.r * m, 0, Math.PI * 2);
        cc.fill();

        // Solo las partículas del frente reciben halo: cuesta poco y da relieve.
        if (prof > 0.72) {
          cc.fillStyle = 'rgba(' + _rgb + ',' + (a * 0.16).toFixed(3) + ')';
          cc.beginPath();
          cc.arc(px, py, p.r * m * 2.6, 0, Math.PI * 2);
          cc.fill();
        }
      }
      // Borde de contención de la silueta.
      cc.strokeStyle = 'rgba(' + _rgb + ',' + (0.16 + _pulso.valor * 0.14).toFixed(3) + ')';
      cc.lineWidth = ln;
      cc.beginPath(); cc.arc(centro, centro, radio * 1.06 * escala, 0, Math.PI * 2); cc.stroke();
      cc.lineWidth = ln;
    }

    let _rgb = '0,255,255', inc = 0.42;

    function frame() {
      // FLUIDEZ (05/10/2026): con la app en segundo plano NO se redibuja la
      // esfera (ahorra GPU y bateria); al volver se retoma sola.
      if (document.hidden) { requestAnimationFrame(frame); return; }
      // Transición suave de color entre estados.
      for (let i = 0; i < 3; i++) _color[i] += (_objetivo[i] - _color[i]) * 0.08;
      const r = Math.round(_color[0]), g = Math.round(_color[1]), b = Math.round(_color[2]);
      const rgb = r + ',' + g + ',' + b;
      _rgb = rgb;
      // SOLO se toca la variable CSS cuando el color CAMBIA de verdad: antes se
      // reescribia en cada cuadro y forzaba recalcular estilos de toda la app.
      if (rgb !== _rgbCSS) {
        _rgbCSS = rgb;
        document.documentElement.style.setProperty('--jc', rgb);
      }

      const vel = _estado === 'WRITING' ? 0.034
                : _estado === 'THINKING' ? 0.030
                : _estado === 'SPEAKING' ? 0.026
                : _estado === 'LISTENING' ? 0.012
                : _estado === 'ARMED' ? 0.008
                : _estado === 'ASLEEP' ? 0.004 : 0.0055;
      ang = (ang + vel) % (Math.PI * 2);
      t += 0.05;

      // Respiración: en reposo apenas se nota; hablando o trabajando, late.
      const intenso = _estado === 'SPEAKING' || _estado === 'WRITING' || _estado === 'THINKING';
      const objetivo = intenso ? (0.5 + 0.5 * Math.sin(t * 1.9)) : 0;
      _pulso.valor += (objetivo - _pulso.valor) * 0.12;
      const escala = 1 + _pulso.valor * 0.07;

      ctx.clearRect(0, 0, LADO, LADO);
      inc = 0.42;

      // Núcleo: da cuerpo al centro para que no se vea hueco.
      const nuc = ctx.createRadialGradient(C, C, 0, C, C, RAD * 0.95 * escala);
      nuc.addColorStop(0, 'rgba(' + rgb + ',' + (0.34 + _pulso.valor * 0.2) + ')');
      nuc.addColorStop(0.55, 'rgba(' + rgb + ',0.11)');
      nuc.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.fillStyle = nuc;
      ctx.beginPath(); ctx.arc(C, C, RAD * 1.05 * escala, 0, Math.PI * 2); ctx.fill();

      pintar(ctx, LADO, C, RAD, F, escala);

      // --- Esfera grande de la llamada (si la pantalla de llamada existe) ---
      if (ctxG) {
        ctxG.clearRect(0, 0, LG, LG);
        const nucG = ctxG.createRadialGradient(CG, CG, 0, CG, CG, RADG * 0.95 * escala);
        nucG.addColorStop(0, 'rgba(' + rgb + ',' + (0.30 + _pulso.valor * 0.2) + ')');
        nucG.addColorStop(0.55, 'rgba(' + rgb + ',0.10)');
        nucG.addColorStop(1, 'rgba(' + rgb + ',0)');
        ctxG.fillStyle = nucG;
        ctxG.beginPath(); ctxG.arc(CG, CG, RADG * 1.05 * escala, 0, Math.PI * 2); ctxG.fill();
        pintar(ctxG, LG, CG, RADG, F, escala);
      }

      requestAnimationFrame(frame);
    }
    frame();
  })();

  /* ---- Medidor de barras (estilo nota de voz de WhatsApp) ----
     Barritas verticales centradas y redondeadas que suben y bajan. Cada barra
     lleva su propia altura suavizada hacia un objetivo aleatorio: eso es lo que
     hace que se vea como voz real y no como una onda matemática. Sin la
     suavización las barras saltarían a lo loco (parece ruido); sin el objetivo
     aleatorio se vería un patrón repetido y artificial. */
  (function () {
    const cv = _el('onda');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = 320, H = 44;           // resolución interna (el CSS la encoge)
    const N = 26;                    // nº de barras
    const ANCHO = 3.4;               // grosor de cada barra
    const HUECO = (W - N * ANCHO) / (N - 1);
    const MIN = 3;                   // altura mínima: la barra nunca desaparece
    const MAX = H - 6;

    // h = altura actual, obj = a dónde va. Al arrancar, todas en reposo.
    const b = [];
    for (let i = 0; i < N; i++) b.push({ h: MIN, obj: MIN });

    let t = 0, tic = 0;
    function frame() {
      // FLUIDEZ (05/10/2026): no se redibuja en segundo plano y el color se lee
      // ya calculado (antes: getComputedStyle en CADA cuadro = recalculo).
      if (document.hidden) { requestAnimationFrame(frame); return; }
      const rgb = _rgbCSS || '0,255,255';
      const hablando = _estado === 'SPEAKING' || _estado === 'WRITING';
      const escuchando = _estado === 'LISTENING';
      const pensando = _estado === 'THINKING';

      // Cada pocos frames se sortean nuevas alturas objetivo. Refrescar en cada
      // frame haría un temblor nervioso; así el ritmo se parece al del habla.
      tic++;
      const cada = hablando ? 4 : pensando ? 3 : 10;
      if (tic % cada === 0) {
        t += 1;
        for (let i = 0; i < N; i++) {
          if (hablando) {
            // Envolvente lenta común: sílabas (sube y baja todo el bloque) +
            // variación por barra, que es lo que da la textura de voz.
            const silaba = 0.45 + 0.55 * Math.abs(Math.sin(t * 0.22 + i * 0.04));
            b[i].obj = MIN + (MAX - MIN) * silaba * (0.25 + Math.random() * 0.75);
          } else if (escuchando) {
            b[i].obj = MIN + (MAX - MIN) * 0.3 * Math.random();
          } else if (pensando) {
            // TRABAJANDO: oleada continua y vibrante, como una barra de progreso
            // viva (orden del jefe 04/10/2026).
            const oleada = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.5 - i * 0.35));
            b[i].obj = MIN + (MAX - MIN) * 0.62 * oleada;
          } else {
            b[i].obj = MIN;           // inactivo: línea de puntitos en reposo
          }
        }
      }

      // Subida rápida y bajada más lenta, igual que un VU real.
      for (let i = 0; i < N; i++) {
        const k = b[i].obj > b[i].h ? 0.45 : 0.14;
        b[i].h += (b[i].obj - b[i].h) * k;
      }

      ctx.clearRect(0, 0, W, H);
      const cy = H / 2;
      for (let i = 0; i < N; i++) {
        const x = i * (ANCHO + HUECO);
        // Se desvanece en los extremos para no chocar con el texto ni el botón.
        const borde = Math.min(1, Math.min(i, N - 1 - i) / 3.5);
        const alto = Math.max(MIN, b[i].h);
        const a = (0.3 + 0.6 * (alto / MAX)) * (0.35 + 0.65 * borde);
        ctx.fillStyle = 'rgba(' + rgb + ',' + a.toFixed(3) + ')';
        ctx.beginPath();
        // roundRect no está en WebView2 antiguos: se emula con un rectángulo y
        // dos semicírculos en las puntas.
        const r = ANCHO / 2;
        ctx.fillRect(x, cy - alto / 2 + r, ANCHO, Math.max(0, alto - ANCHO));
        ctx.arc(x + r, cy - alto / 2 + r, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + r, cy + alto / 2 - r, r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    frame();
  })();

  /* ---- API que llama Python ---- */
  window.wSetEstado = function (st) {
    // Al ENTRAR en "pensar" se alterna Trabajando... / Procesando...
    if (st === 'THINKING' && _estado !== 'THINKING') {
      _ETIQUETAS.THINKING = _TEXTOS_PENSANDO[_idxPensando];
      _idxPensando = (_idxPensando + 1) % _TEXTOS_PENSANDO.length;
    }
    _estado = st || 'MUTED';
    // Copia: si se apuntara al array del tema, la transición del bucle de
    // dibujo lo mutaría y el color del tema quedaría corrompido.
    _objetivo = (_COLORES[_estado] || _COLORES.MUTED).slice();
    const expandido = document.body.classList.contains('expandido');
    const chatAbierto = document.body.classList.contains('chat-abierto');
    // El reposo no cuenta como 'activo' visualmente (está en pausa), pero
    // tampoco es inactivo: mantiene su propia clase st-asleep con latido lento.
    const enPausa = _estado === 'MUTED' || _estado === 'ASLEEP';
    // NO se reescribe className entero (borraria scroll-oculto, chat-abierto...):
    // se quitan SOLO las clases de estado st-* y se pone la nueva, conservando
    // el resto (fix 04/10/2026: la barra auto-oculta parpadeaba al cambiar estado).
    const cl = document.body.classList;
    cl.remove('st-muted','st-listening','st-armed','st-asleep','st-speaking','st-thinking','st-writing');
    cl.add('st-' + _estado.toLowerCase());
    cl.toggle('activo', !enPausa);
    cl.toggle('expandido', expandido);
    cl.toggle('chat-abierto', chatAbierto);
    const e = _el('wEstado');
    if (e) e.textContent = _ETIQUETAS[_estado] || _estado;
    if (enPausa) {
      // Al volver al reposo no se corta la burbuja en seco: cierra con el
      // mismo temporizador de 5 s (para que el jefe alcance a leerla).
      window.wProgramarCierrePanel();
    }
  };

  // Frase corta en la barra (sin abrir el panel).
  window.wSetTexto = function (t) {
    const el = _el('wFrase');
    if (el) el.textContent = t || '';
  };

  /* ---- Burbuja superior ----
     Muestra la frase del jefe y la respuesta de JARVIS ENCIMA del icono
     flotante cuando el mini-chat está contraído: la ventana crece hacia
     arriba (mecanismo expandir), la barra se queda abajo y la burbuja ocupa
     el espacio extra. Al volver al reposo se cierra sola en 3,5 s. */
  window.wBurbuja = function (rol, texto) {
    const au = _el('wBurbujaAutor'), bu = _el('wBurbujaTexto');
    if (!bu) return;
    if (au) au.textContent = rol === 'jefe' ? 'USTED' : 'JARVIS';
    const seguro = String(texto || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '$1');
    bu.innerHTML = seguro + (rol !== 'jefe' ? '<span class="cursor"></span>' : '');
    bu.classList.toggle('jefe', rol === 'jefe');
    bu.scrollTop = bu.scrollHeight;
    if (!document.body.classList.contains('expandido')) {
      document.body.classList.add('expandido');
      const api = _api();
      if (api && api.expandir) api.expandir(true);
    }
    // Temporizador inteligente (orden del jefe):
    // - El mensaje del jefe ("USTED") NO se desvanece: se mantiene arriba
    //   hasta que llegue la respuesta de JARVIS.
    // - La respuesta de JARVIS se limpia sola tras 11 segundos, dejando la
    //   parte superior sin letras (solo el icono flotante).
    if (_timerCierre) clearTimeout(_timerCierre);
    _timerCierre = null;
    if (rol !== 'jefe') {
      _timerCierre = setTimeout(function () {
        if (document.body.classList.contains('expandido')) window.wCerrarPanel();
      }, 11000);

  // ENVIAR un mensaje se salta YA al fondo, sin la bajada lenta que molestaba.
  function _irAlFondoYa() {

  let _tecleando = null;      // {el, html, timer, span, i}

    // Ahora 10-22 ms por letra, con el suelo en 10 ms (por debajo el WebView del
    // movil empieza a no repintar bien).

      span.textContent = plano.slice(0, i);
      // SEGUIMIENTO SUAVE (fix 19.6): en vez de saltar al fondo en cada letra
      // (lo que se veia como un "brinco" raro), se pide el seguimiento; el
      // scroll acompana el texto que crece, frame a frame. Solo si esta abajo.
      _seguirFondo();
      estado.timer = setTimeout(tick, paso);
    })();

  /* EFECTO POR DEFECTO GARANTIZADO (orden del jefe 04/10/2026):

     activo SIEMPRE. Si el jefe lo cambia, su eleccion se guarda y se respeta

     mensajes que llegaron con la app cerrada se ven al abrir, sin duplicar. */
  window.wRecargarChat = function (lista) {
    try {
      const arr = (typeof lista === 'string') ? JSON.parse(lista) : lista;
      if (!arr || !arr.length) return;
      const zona = _el('wMensajes');
      if (!zona) return;
      let ult = null;
      for (let i = _hist.length - 1; i >= 0; i--) {
        if (_hist[i] && _hist[i].de && _hist[i].tipo !== 'imagen') { ult = _hist[i]; break; }
      }
      let desde = 0;
      if (ult) {
        for (let i = arr.length - 1; i >= 0; i--) {
          if (arr[i] && arr[i].texto === ult.texto && arr[i].de === ult.de) { desde = i + 1; break; }
        }

        if (!m || (m.de !== 'jefe' && m.de !== 'jarvis') || !m.texto) continue;
        const horaMs = (m.fecha && m.fecha > 0)
          ? (m.fecha < 100000000000 ? m.fecha * 1000 : m.fecha) : Date.now();
        _hist.push({ de: m.de, texto: m.texto, hora: horaMs });

  /* ---- IMAGEN AMPLIABLE A PANTALLA COMPLETA (19.1, 04/10/2026) ----

  window.wImagenGrande = function (abrir, src) {

        if (ahora - ultTap < 300) {

  function _insertarImagen(rol, ruta, esHistorial) {

    _quitarCursoresEsc();
    const d = document.createElement('div');
    d.className = 'msg msg-' + (rol === 'jefe' ? 'jefe' : 'jarvis') + ' msg-img';

  function _insertarMensaje(rol, texto, esHistorial, fecha) {

    _completarTecleo();

    // Solo sigue el fondo si el jefe YA estaba abajo (orden 04/10/2026).
    const alFondo = _medirFondo(zona);
    zona.appendChild(d);
    if (!sinAnim && efecto === 'escribir') {
      _teclearMensaje(d, htmlFinal);
    }
    if (!esHistorial) {
      if (rol === 'jefe') {
        // MENSAJE DEL JEFE: baja YA al final (orden 05/10/2026, sin bajada lenta).
        _irAlFondoYa();
      } else {
        if (alFondo) _pinAbajo = true;
        _seguirFondo();                   // acompana el mensaje sin saltos (fix 19.6)
        if (!alFondo) _marcarScroll();    // si ya estamos abajo, no parpadea el boton
      }
      // Persiste el mensaje (jefe/jarvis) en el historial del telefono.
      window.wPushHistorial(rol === 'jefe' ? 'jefe' : 'jarvis', plano, horaMs);
      // FIX 19.6: el mensaje en vivo ya esta pintado -> se cuenta (indice del
      // tramo al dia; sin esto el scroll hacia atras cargaba repetidos).
      _pintadosHasta = Math.min(_hist.length, _pintadosHasta + 1);
      // Recorta nodos viejos si el chat crece mucho (blinda RAM/fluidez).
      _recortarViejos();
    }
  }

  /* ---- Historial persistente con CARGA POR TRAMOS (04/10/2026) ----
     Igual que Telegram: los mensajes NO se pierden, pero al abrir se pintan
     solo los ULTIMOS (tramo), no todo el historial. Al subir hasta arriba se
     carga otro tramo mas antiguo ("scroll infinito" hacia atras). Asi el chat
     soporta miles de mensajes SIN laguear y sin comer RAM.
     (Las variables viven mas arriba, antes de _insertarMensaje.) */

  /* FIX 04/10/2026: _quienMira() se llamaba pero NUNCA se definio -> cada vez
     que se pintaba/cargaba un mensaje lanzaba "ReferenceError: _quienMira is
     not defined" y ROMPIA el efecto de tecleo (el mensaje quedaba bugueado).
     Devuelve true si conviene recortar nodos viejos (el chat tiene mas de lo
     permitido en pantalla). */
  function _quienMira() {
    const zona = _el('wMensajes');
    if (!zona) return false;
    return zona.children.length > _TOPE_DOM;
  }

  /* Carga un tramo de mensajes antiguos ARRIBA del chat, sin brincar el scroll. */
  function _cargarTramoArriba() {
    const zona = _el('wMensajes');
    if (!zona) return;
    const desde = Math.max(0, _hist.length - _pintadosHasta - _TRAMO);
    const hasta = _hist.length - _pintadosHasta;
    if (hasta <= 0 || desde >= hasta) return;
    const altoAntes = zona.scrollHeight;
    const quien = _quienMira();
    _cargandoHistorial = true;
    try {
      for (let i = desde; i < hasta; i++) {
        const m = _hist[i];
        if (!m) continue;
        if (m.tipo === 'imagen') {
          _insertarImagen(m.de, m.texto, true);
        } else if (m.de === 'jefe' || m.de === 'jarvis') {
          _insertarMensaje(m.de, m.texto, true);
        }
      }
    } finally {
      _cargandoHistorial = false;   // BLINDAJE: nunca queda pegado en true
    }
    _pintadosHasta = _hist.length - desde;
    if (quien) _recortarViejos();
    const altoDespues = zona.scrollHeight;
    zona.scrollTop = zona.scrollTop + (altoDespues - altoAntes);
    _marcarScroll();
  }

  /* Recorta los nodos mas viejos de arriba si se pasa del tope (RAM). */
  let _recortando = false;  // true mientras se quitan nodos viejos (ajuste propio)
  function _recortarViejos() {
    const zona = _el('wMensajes');
    if (!zona) return;
    let nodos = zona.children.length;
    if (nodos <= _TOPE_DOM) return;
    _recortando = true;                       // los movimientos de scroll son NUESTROS
    const altoAntes = zona.scrollHeight;
    while (nodos > _TOPE_DOM && zona.firstChild) {
      zona.removeChild(zona.firstChild);
      nodos--;
      _pintadosHasta = Math.max(_TRAMO, _pintadosHasta - 1);
    }
    const altoDespues = zona.scrollHeight;
    zona.scrollTop = Math.max(0, zona.scrollTop - (altoAntes - altoDespues));
    _recortando = false;
  }

  function _cargarHistorial() {
    // AL ENTRAR (ajuste 05/10/2026, orden del jefe): se pintan los ULTIMOS
    // mensajes de la conversacion, SIN animacion (para que no se re-tecleen).
    // El saludo de JARVIS aparece SOLO si todavia no hay conversacion.
    try {
      const api = _api();
      if (!api || !api.historial_leer) { _saludoInicial(); return; }
      api.historial_leer().then((r) => {
        const txt = (r && typeof r.leer === 'string') ? r.leer : (typeof r === 'string' ? r : '');
        let arr = [];
        try { arr = JSON.parse(txt); } catch (e) { arr = []; }
        if (!Array.isArray(arr)) arr = [];
        _hist = arr;
        if (_hist.length === 0) { _saludoInicial(); return; }
        // Solo el ULTIMO tramo (como Telegram), pintado como historial.
        const desde = Math.max(0, _hist.length - _TRAMO);
        _cargandoHistorial = true;
        try {
          for (let i = desde; i < _hist.length; i++) {
            const m = _hist[i];
            if (!m) continue;
            if (m.tipo === 'imagen') {
              _insertarImagen(m.de, m.texto, true);
            } else if (m.de === 'jefe' || m.de === 'jarvis') {
              _insertarMensaje(m.de, m.texto, true, m.hora || 0);
            }
          }
        } finally {
          // BLINDAJE (05/10/2026): pase lo que pase, nunca queda pegado en true
          // (si quedaba, el chat perdia animaciones y el pin del scroll).
          _cargandoHistorial = false;
        }
        _pintadosHasta = _hist.length - desde;
        // AL ABRIR se salta YA al final (orden del jefe 05/10/2026): nada de
        // empezar arriba y bajar despacio.
        _irAlFondoYa();
        _marcarScroll();
      }).catch(() => { _saludoInicial(); });
    } catch (e) { _saludoInicial(); }
  }

  /* Saludo de JARVIS cuando la conversacion esta vacia (sin animacion). */
  function _saludoInicial() {
    const bienvenida = 'Hola, jefe. Soy JARVIS. ¿En qué le ayudo?';
    _hist.push({ de: 'jarvis', texto: bienvenida });
    _insertarMensaje('jarvis', bienvenida, true);
    _pintadosHasta = _hist.length;
    const zona = _el('wMensajes');
    if (zona) {
      _pinAbajo = true;
      zona.scrollTop = zona.scrollHeight;
      _marcarScroll();
    }
  }
  function _guardarHistorial() {
    try {
      const api = _api();
      if (!api || !api.historial_guardar || _histGuardando) return;
      _histGuardando = true;
      api.historial_guardar(JSON.stringify(_hist)).then(() => { _histGuardando = false; })
        .catch(() => { _histGuardando = false; });
    } catch (e) { _histGuardando = false; }
  }
  // FIX 04/10/2026: estas tres eran `window.x = function(){}` (NO se elevan) y
  // se LLAMAN antes de definirse en _insertarMensaje -> TypeError y el tecleo
  // se cortaba. Ahora son funciones DECLARADAS (se elevan) y se exponen a window.
  function wSetHistorial(json) {
    try {
      const arr = JSON.parse(json || '[]');
      if (Array.isArray(arr)) { _hist = arr; }
    } catch (e) { }
  }
  function wPushHistorial(rol, texto, horaMs) {
    if (rol !== 'jefe' && rol !== 'jarvis') return;
    _hist.push({ de: rol, texto: texto, hora: horaMs || Date.now() });
    // Tope del historial en disco: se tira lo mas viejo de a poco (no de golpe,
    // para que la carga por tramos siga teniendo sentido).
    if (_hist.length > _TOPE_HIST) _hist = _hist.slice(-_TOPE_HIST);
    // Guardado DIFERIDO (blinda fluidez): agrupa escrituras seguidas. En chats
    // rapidos no se escribe disco en cada mensaje, solo al final de la racha.
    if (_guardandoPendiente) return;
    _guardandoPendiente = true;
    setTimeout(function () { _guardandoPendiente = false; _guardarHistorial(); }, 700);
  }
  function wLimpiarHistorial() {
    _hist = [];
    _pintadosHasta = 0;
    _guardarHistorial();
  }
  window.wSetHistorial = wSetHistorial;
  window.wPushHistorial = wPushHistorial;
  window.wLimpiarHistorial = wLimpiarHistorial;
  _cargarHistorial();

  /* ---- BAJAR AL FINAL AL ABRIR (fix 19.9, orden del jefe 04/10/2026) ----
     Al cerrar y reabrir la app, el chat debe quedar SIEMPRE en lo ultimo
     hablado. Las imagenes y el tecleo terminan de crecer DESPUES del primer
     pintado, asi que un solo scrollTop no basta: se reafirma varias veces. */
  function _irAlFondoAlFinal() {
    const zona = _el('wMensajes');
    if (!zona) return;
    _pinAbajo = true;
    zona.scrollTop = zona.scrollHeight;
    try { zona.scrollTo({ top: zona.scrollHeight, behavior: 'auto' }); } catch (e) {}
    _marcarScroll();
  }
  window.wIrAlFondo = _irAlFondoAlFinal;
  // Refuerzos: a los pocos ms y al terminar de cargar imagenes diferidas.
  [80, 250, 600, 1100, 1800].forEach(function (ms) {
    setTimeout(_irAlFondoAlFinal, ms);
  });

  // Pantalla de carga ELIMINADA (orden del jefe 04/10/2026): arranque directo.

  function _enviar() {
    const inp = _el('wInput');
    if (!inp) return;
    const t = inp.value.trim();
    if (!t) return;
    inp.value = '';
    const api = _api();
    if (api && api.enviar_mensaje) api.enviar_mensaje(t);
  }
  // Boton ADJUNTAR (clip): abre el selector de archivos del telefono y manda
  // la imagen o el documento por Telegram (orden del jefe 04/10/2026).
  (function () {
    const b = _el('btnAdjuntar');
    if (!b) return;
    b.addEventListener('click', () => {
      const api = _api();
      if (api && api.adjuntar) api.adjuntar();
    });
  })();

  // Mientras JARVIS trabaja, el boton se vuelve ROJO y sirve para interrumpir
  // (orden del jefe 04/10/2026); el resto del tiempo, envia.
  // Si el jefe escribe texto en la caja, el boton vuelve a "enviar" (aunque
  // JARVIS siga trabajando) para poder mandar el mensaje (orden 04/10/2026).
  let _trabajandoBtn = false;
  function _refrescarBotonEnviar() {
    const b = _el('btnEnviar');
    if (!b) return;
    const inp = _el('wInput');
    const hayTexto = !!(inp && inp.value && inp.value.trim().length > 0);
    const esStop = _trabajandoBtn && !hayTexto;
    b.classList.toggle('stop', esStop);
    b.title = esStop ? 'Interrumpir a JARVIS' : 'Enviar';
  }
  window.wSetTrabajando = function (activo) {
    _trabajandoBtn = !!activo;
    _refrescarBotonEnviar();
  };
  _el('btnEnviar').addEventListener('click', () => {
    // Se decide EN EL MOMENTO DEL CLIC (no de una variable vieja): si hay texto
    // escrito, SIEMPRE se envia (y el bot lo ENCOLA); el rojo/interrumpir solo
    // actua con la caja VACIA (orden 04/10/2026).
    const inp = _el('wInput');
    const hayTexto = !!(inp && inp.value && inp.value.trim().length > 0);
    if (hayTexto) { _enviar(); return; }
    if (_trabajandoBtn) {
      const api = _api();
      if (api && api.interrumpir) api.interrumpir();
      window.wSetTrabajando(false);
      return;
    }
    _enviar();
  });
  // Al teclear algo, el boton vuelve a "enviar" en vivo.
  (function () {
    const inp = _el('wInput');
    if (inp) inp.addEventListener('input', _refrescarBotonEnviar);
  })();
  _el('wInput').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); _enviar(); }
  });
  _el('wInput').addEventListener('focusin', () => {
    const api = _api();
    if (api && api.dar_foco) api.dar_foco();
  });
  // El icono del microfono se elimino (orden del jefe 04/10/2026): solo quedan
  // la caja de texto y el boton de enviar. La voz ahora va por la esfera (llamada).

  // El boton OJO se elimino (orden del jefe 04/10/2026): daba menos espacio a
  // las ondas. La barra ahora reparte esfera - estado - ondas - ajustes.

  window.addEventListener('pywebviewready', () => {
    const api = _api();
    // El tema primero: así la esfera aparece ya con el color elegido en vez
    // de arrancar en cian y virar a la vista.
    if (api && api.get_sphere_theme) {
      api.get_sphere_theme().then((r) => {
        if (r && r.ok && r.theme) window.wSetTema(r.theme);
      }).catch(() => {});
    }
    if (api && api.estado) {
      api.estado().then((r) => {
        if (r && r.ok) {
          window.wSetEstado(r.muted ? 'MUTED' : (r.estado || 'LISTENING'));
          // El altavoz se SINCRONIZA con el estado real de Python al arrancar:
          // si la voz guardada esta activada/desactivada, el boton lo refleja.
          // Sin esto, el boton podia pintarse apagado mientras el backend
          // seguia con la voz encendida (y JARVIS hablaba con el icono off).
          if (typeof r.voz !== 'undefined') window.wSetVoz(r.voz);
        }
      });
    }
    // Efecto de aparición guardado (por defecto: "escribir").
    window.wSetEfecto(_efectoActual);
  });

  // INICIALIZACION GARANTIZADA DEL EFECTO (fix 04/10/2026):
  // Antes solo se hacia dentro de 'pywebviewready', que la app Android NUNCA
  // dispara -> el efecto no arrancaba. Ahora se aplica SIEMPRE al cargar, en la
  // app y en la PC. Por defecto "escribir"; si el jefe lo cambio, se respeta su
  // eleccion guardada (persistente).
  try { window.wEfectoPorDefecto(); } catch (e) {}
  // Re-aplica al terminar de cargar el DOM (por si el script corre antes).
  document.addEventListener('DOMContentLoaded', function () {
    try { window.wEfectoPorDefecto(); } catch (e) {}
  });
</script>
</body>
</html>
