<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - Wally</title>
<style>
  :root { --azul: #2b6cff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0f1220; color: #e8ecf5;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 1px; }
  #score { margin-bottom: 10px; font-size: 16px; color: var(--azul); }
  canvas {
    background: #1a1f33; border: 2px solid var(--azul);
    border-radius: 8px; box-shadow: 0 0 24px rgba(43,108,255,.35);
  }
  #msg { margin-top: 12px; min-height: 20px; font-size: 14px; color: #ff6b6b; }
  .hint { margin-top: 6px; font-size: 12px; color: #8a93ad; }
</style>
</head>
<body>
  <h1>🐍 SNAKE</h1>
  <div id="score">Puntos: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="msg"></div>
  <div class="hint">Flechas para mover · Espacio para reiniciar</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

const CELL = 20;
const COLS = canvas.width / CELL;
const ROWS = canvas.height / CELL;

let snake, dir, nextDir, food, score, running, loop;

function reset() {
  snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  running = true;
  msgEl.textContent = '';
  placeFood();
  scoreEl.textContent = 'Puntos: 0';
  if (loop) clearInterval(loop);
  loop = setInterval(tick, 100);
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    return gameOver('¡GAME OVER! Chocaste la pared.');
  }
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver('¡GAME OVER! Chocaste contigo mismo.');
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Puntos: ' + score;
    placeFood();
  } else {
    snake.pop();
  }
  draw();
}

function gameOver(text) {
  running = false;
  clearInterval(loop);
  msgEl.textContent = text + ' (Espacio para reiniciar)';
}

function draw() {
  ctx.fillStyle = '#1a1f33';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // cuadrícula tenue
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(canvas.width, i*CELL); ctx.stroke();
  }

  // comida
  ctx.fillStyle = '#3ddc84';
  ctx.fillRect(food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4);

  // serpiente
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#2b6cff' : '#ffd23f';
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });
}

document.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' && !running) { reset(); return; }
  if (k === 'ArrowUp' && dir.y === 0) nextDir = {x:0, y:-1};
  else if (k === 'ArrowDown' && dir.y === 0) nextDir = {x:0, y:1};
  else if (k === 'ArrowLeft' && dir.x === 0) nextDir = {x:-1, y:0};
  else if (k === 'ArrowRight' && dir.x === 0) nextDir = {x:1, y:0};
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
});

reset();
</script>
</body>
</html>
