<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 400px;
            height: 400px;
            border: 4px solid #3498db;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #f0f0f0;
            border-radius: 8px;
        }
        #score-board {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            color: #e74c3c;
            font-size: 24px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Snake Game</h1>
        <canvas id="game"></canvas>
        <div id="score-board">Puntuación: <span id="score">0</span></div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        
        // Configuración del juego
        const gridSize = 20;
        const cellSize = canvas.width / gridSize;
        let snake = [];
        let food = {};
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let gameLoop = null;
        
        // Crear el canvas
        canvas.width = 400;
        canvas.height = 400;
        
        // Generar la comida inicial
        function createFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * gridSize),
                    y: Math.floor(Math.random() * gridSize)
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            food = newFood;
        }
        
        // Mover la serpiente
        function moveSnake() {
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            // Verificar bordes
            if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                gameOver();
                return;
            }
            
            // Verificar colisión consigo misma
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }
            
            snake.unshift(head);
            
            // Comida
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                createFood();
            } else {
                snake.pop();
            }
        }
        
        // Dibujar la serpiente y la comida
        function draw() {
            // Fondo
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Alimentación
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(food.x * cellSize + cellSize/2, food.y * cellSize + cellSize/2, cellSize/4, 0, Math.PI * 2);
            ctx.fill();
            
            // Serpiente
            snake.forEach((segment, index) => {
                const x = segment.x * cellSize;
                const y = segment.y * cellSize;
                
                if (index === 0) {
                    // Cabeza - color más brillante
                    ctx.fillStyle = '#2ecc71';
                    ctx.beginPath();
                    ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, 5);
                    ctx.fill();
                } else {
                    // Cuerpo - colores variados
                    ctx.fillStyle = index > 0 ? '#27ae60' : '#2ecc71';
                    ctx.beginPath();
                    ctx.roundRect(x + 1, y + 1, cellSize - 2, cellSize - 2, 5);
                    ctx.fill();
                }
            });
        }
        
        // Bucle principal
        function gameLoop() {
            moveSnake();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Control de teclado
        document.addEventListener('keydown', (e) => {
            switch (direction) {
                case 'ArrowUp':
                    if (direction.y !== 1) direction = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) direction = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) direction = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) direction = { x: 1, y: 0 };
                    break;
            }
        });
        
        // Iniciar el juego
        createFood();
        gameLoop();
    </script>
</body>
</html>
